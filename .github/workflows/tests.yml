name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
  workflow_dispatch:
    inputs:
      tutor_version:
        description: 'Tutor LMS version to test against (e.g. 4.0.0, or "latest")'
        required: false
        default: 'latest'
  schedule:
    # Tutor LMS ships on its own schedule. A weekly run tells us a release
    # broke the integration before a customer does.
    - cron: '0 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2, cs2pr

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Syntax check every PHP file
        run: |
          find src templates tests -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l

      - name: Syntax check the entry points
        run: |
          php -l tutor-learning-paths.php
          php -l uninstall.php

      - name: PHP_CodeSniffer
        run: vendor/bin/phpcs --report-full --report-checkstyle=./phpcs-report.xml
        continue-on-error: true

      - name: Annotate coding standard violations
        if: always()
        run: cs2pr ./phpcs-report.xml
        continue-on-error: true

  unit:
    name: Unit / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3', '8.4' ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Run the unit suite
        run: vendor/bin/phpunit --configuration phpunit.xml.dist

  hooks:
    name: Hook contract / Tutor ${{ matrix.tutor }}
    runs-on: ubuntu-latest
    # Tutor's development branch is an early-warning signal. An unreleased
    # branch dropping a hook is something to know about, not something that
    # should stop us shipping.
    continue-on-error: ${{ matrix.tutor == 'dev' }}

    strategy:
      fail-fast: false
      matrix:
        # Tutor versions only, one PHP, one WordPress. This suite reads Tutor's
        # source instead of booting WordPress, so it needs neither a database
        # nor the WordPress test suite, and adding the version axis to the
        # integration matrix instead would have turned 18 legs into 100+ for
        # information none of those extra legs carry.
        #
        # 3.0.2 is the floor Compatibility::MIN_TUTOR claims to support, 4.0.1
        # is what production runs, 4.0.4 is the newest 4.0.x, and dev is the
        # unreleased branch.
        tutor: [ '3.0.2', '3.9.6', '4.0.1', '4.0.4', 'latest', 'dev' ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Fetch Tutor LMS ${{ matrix.tutor }}
        # TUTOR_PLUGIN_DIR means no WordPress core is needed. The script exports
        # TUTOR_DIR for the next step.
        env:
          TUTOR_PLUGIN_DIR: ${{ github.workspace }}/.tutor
        run: bash bin/install-tutor.sh '${{ matrix.tutor }}'

      - name: Check the hook contract
        run: vendor/bin/phpunit --configuration phpunit-hooks.xml.dist

  integration:
    name: Integration / PHP ${{ matrix.php }} / WP ${{ matrix.wp }}
    runs-on: ubuntu-latest
    # PHP 8.4 and WordPress nightly are early-warning signals, not gates.
    continue-on-error: ${{ matrix.php == '8.4' || matrix.wp == 'nightly' }}

    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3', '8.4' ]
        wp: [ '6.4', '6.6', '6.8', 'latest', 'nightly' ]
        exclude:
          # WordPress 6.4 and 6.6 predate PHP 8.4 and fail for reasons that
          # have nothing to do with this plugin. Testing them proves nothing.
          - php: '8.4'
            wp: '6.4'
          - php: '8.4'
            wp: '6.6'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_ROOT_PASSWORD: ''
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, zip, gd
          coverage: none
          tools: composer:v2

      - name: Install system dependencies
        # subversion is not on every runner image, and install-wp-tests.sh
        # needs it to export the WordPress test suite.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq subversion mysql-client unzip

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3

      - name: Install the WordPress test suite
        run: |
          bash bin/install-wp-tests.sh wordpress_test root '' 127.0.0.1:3306 ${{ matrix.wp }} true

      - name: Install Tutor LMS
        env:
          TUTOR_VERSION: ${{ github.event.inputs.tutor_version || 'latest' }}
        run: bash bin/install-tutor.sh

      - name: Report the environment under test
        run: |
          {
            echo "### PHP ${{ matrix.php }} / WordPress ${{ matrix.wp }}"
            echo ""
            echo "- PHP: \`$(php -r 'echo PHP_VERSION;')\`"
            echo "- Tutor LMS: \`${TUTOR_INSTALLED_VERSION:-unknown}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Contract tests
        # Run first and on their own. If the fixtures no longer agree with
        # Tutor, every later failure is a symptom of this one.
        env:
          WP_TESTS_PHPUNIT_POLYFILLS_PATH: ${{ github.workspace }}/vendor/yoast/phpunit-polyfills
        run: vendor/bin/phpunit --configuration phpunit-integration.xml.dist --group contract

      - name: Integration suite
        env:
          WP_TESTS_PHPUNIT_POLYFILLS_PATH: ${{ github.workspace }}/vendor/yoast/phpunit-polyfills
        run: vendor/bin/phpunit --configuration phpunit-integration.xml.dist

  js:
    name: JavaScript (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Shell-expanded glob on purpose: `node --test dir/**/*.mjs` needs Node 22,
      # and this matrix pins 20.
      - name: Run the JavaScript tests
        run: node --test tests/js/*.test.mjs

  results:
    name: Test results
    runs-on: ubuntu-latest
    needs: [ lint, js, unit, hooks, integration ]
    if: always()
    steps:
      - name: Fail if a required job failed
        # `integration` reports success even when an experimental leg fails,
        # because those legs are marked continue-on-error. This gate exists so
        # a genuine failure in lint or unit still blocks the merge.
        run: |
          if [ "${{ needs.unit.result }}" != "success" ]; then
            echo "The unit suite failed."
            exit 1
          fi
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "Linting failed."
            exit 1
          fi
          if [ "${{ needs.js.result }}" != "success" ]; then
            echo "The JavaScript suite failed."
            exit 1
          fi
          if [ "${{ needs.hooks.result }}" != "success" ]; then
            echo "A released Tutor LMS no longer provides a hook this plugin attaches to."
            exit 1
          fi
          if [ "${{ needs.integration.result }}" != "success" ]; then
            echo "The integration suite failed."
            exit 1
          fi
          echo "All required checks passed."
